# Verify location permission denial shows an appropriate message.
# Multi-assignment note: taps the FIRST Check In (index: 0).
appId: app.fazoo.mobile
---
- runFlow: sign-in.yaml
- tapOn:
    text: "Check In"
    index: 0
- setPermissions:
    permissions:
      location: deny
- tapOn: "Get my location"
- assertVisible: ".*[Ll]ocation.*"
